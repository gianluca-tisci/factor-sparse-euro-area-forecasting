# EXPLORATORY sensitivity; every other setting matches forecast_analysis.yaml.
classification: EXPLORATORY
test_start: '2015-01'
horizon: 1
quarterly_series:
  - GDP_EA
  - HFCE_EA
  - GFCE_EA
  - GFCF_EA
  - EXPGS_EA
  - IMPGS_EA
  - WS_EA
  - TEMP_EA
  - THOURS_EA
  - EMPRT_EA
  - EMPPR_EA
  - EMPPA_EA
  - GFACON_EA
  - GFAMG_EA
  - CONSD_EA
  - ESC_EA
initial_factor_variance: 10.0
variance_floor: 1.0e-8
missing_feature_policy: complete_training_rows_and_available_forecast_columns
pca_missing_method: balanced_months_then_VAR_carry
# Applies to cold starts and recovery/check starts; warm-start logic unchanged.
dfm_initialization: balanced_t_minus_3
reestimation_start: warm  # historical sensitivity; matches the adopted starting schedule
training_outlier_policy: published_labels_and_own_lags  # preserve historical results
